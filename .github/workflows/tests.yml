name: Rodar testes unitários back + front

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: vitta6464
          MYSQL_DATABASE: vittasync
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      TWILIO_ACCOUNT_SID: "SK1bd328b84ed4a1fa4acea6c25db355e6X"
      TWILIO_AUTH_TOKEN: "48P4hgCpbv63Mpmd9Xvb2uDyIRImIeF7X"
      TWILIO_PHONE_NUMBER: "+15075858369"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências Node
        run: npm ci

      - name: Rodar testes (Maven profile test)
        run: mvn test -Dspring.profiles.active=test
        working-directory: VittaSyncAPI
